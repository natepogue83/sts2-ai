[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stsai"
version = "0.1.0"
description = "Patch-aware research tooling for training Slay the Spire 2 agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "STSAI contributors" }]
dependencies = []

[project.optional-dependencies]
train = ["numpy>=2.0"]
deep = ["torch>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
stsai = "stsai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
